<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Intro Test</title>
<style>
  body{margin:0;background:#000;}
  .noosphere-intro{position:fixed;inset:0;z-index:10000;background:#020408;display:flex;align-items:center;justify-content:center;}
  .noosphere-video{width:100%;height:100%;object-fit:cover;display:block;background:#020408;position:relative;z-index:2;}
  .noosphere-skip{position:fixed;right:24px;bottom:24px;z-index:10001;background:rgba(10,14,28,.6);color:#7aa7ff;border:1px solid #7aa7ff;font-family:monospace;padding:10px 18px;cursor:pointer;}
</style>
</head>
<body>
<div class="noosphere-intro" id="intro">
  <video id="v" class="noosphere-video" autoplay muted playsinline preload="auto" poster="assets/videos/noosphere-poster.jpg">
    <source src="assets/videos/noosphere-intro-baseline.mp4" type="video/mp4">
  </video>
  <button class="noosphere-skip" onclick="document.getElementById('intro').style.display='none'">Enter ›</button>
</div>
</body>
</html>
